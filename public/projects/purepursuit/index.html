<script>
  const swup = new Swup({
    containers: ['#swup'],
    animationSelector: '[class*="swup-transition-"]',
    cache: true,
    preload: true,
    animateHistoryBrowsing: true,

    plugins: [
      new SwupPreloadPlugin(),
      new SwupProgressPlugin(),
      new SwupScriptsPlugin({
        optin: false
      })
    ]
  })
  window.swup = swup
</script>


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
  crossorigin="anonymous"></script>

<script>
  

  
  const KATEX_CONFIG = {
    delimiters: [
      {left: "$$", right: "$$", display: true},
      {left: "$", right: "$", display: false},
      {left: "\\[", right: "\\]", display: true},
      {left: "\\(", right: "\\)", display: false}
    ],
    ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
    throwOnError: false
  };

  
  function renderKatex() {
    
    if (typeof renderMathInElement !== "function") {
      console.log("⏳ Waiting for KaTeX to load...");
      return;
    }

    
    const contentArea = document.getElementById('swup') || document.body;

    try {
      renderMathInElement(contentArea, KATEX_CONFIG);
      console.log("✅ KaTeX rendered successfully");
    } catch (error) {
      console.error("❌ KaTeX rendering error:", error);
    }
  }

  
  function renderKatexWithRetry(maxRetries = 10, delay = 100) {
    let attempts = 0;

    const attempt = () => {
      if (typeof renderMathInElement === "function") {
        renderKatex();
      } else if (attempts < maxRetries) {
        attempts++;
        setTimeout(attempt, delay);
      } else {
        console.warn("⚠️ KaTeX auto-render not available after", maxRetries, "attempts");
      }
    };

    attempt();
  }

  
  function setupSwupIntegration() {
    
    if (window.swup) {
      window.swup.hooks.on('page:view', () => {
        console.log("🔄 Swup transition complete, re-rendering KaTeX...");
        
        setTimeout(() => renderKatexWithRetry(3, 50), 50);
      });
      console.log("✅ KaTeX-Swup integration ready");
    } else {
      
      setTimeout(setupSwupIntegration, 100);
    }
  }

  
  document.addEventListener("DOMContentLoaded", function () {
    console.log("🚀 Initializing KaTeX...");

    
    renderKatexWithRetry();

    
    setupSwupIntegration();
  });

  
  window.renderKatex = renderKatex;
</script>

<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  let initialized = false;

  function renderMermaid() {
    const contentArea = document.getElementById('swup') || document.body;
    const mermaidBlocks = contentArea.querySelectorAll('.language-mermaid, .mermaid');

    if (mermaidBlocks.length === 0) {
      console.log("ℹ️ No mermaid blocks found on this page");
      return;
    }

    if (!initialized) {
      mermaid.initialize({startOnLoad: false, theme: 'dark'});
      initialized = true;
    }

    mermaidBlocks.forEach(el => {
      if (el.dataset.processed === 'true') {
        const source = el.dataset.mermaidSource;
        if (source) {
          el.innerHTML = source;
          el.removeAttribute('data-processed');
        }
      } else {
        el.dataset.mermaidSource = el.textContent;
      }
    });

    mermaid.run({nodes: mermaidBlocks})
      .then(() => console.log("✅ Mermaid rendered successfully"))
      .catch(err => console.error("❌ Mermaid rendering error:", err));
  }

  function renderMermaidWithRetry(maxRetries = 10, delay = 100) {
    let attempts = 0;

    const attempt = () => {
      if (typeof mermaid.initialize === "function") {
        renderMermaid();
      } else if (attempts < maxRetries) {
        attempts++;
        setTimeout(attempt, delay);
      } else {
        console.warn("⚠️ Mermaid auto-render not available after", maxRetries, "attempts");
      }
    };

    attempt();
  }

  
  function setupSwupIntegration() {
    
    if (window.swup) {
      window.swup.hooks.on('page:view', () => {
        console.log("🔄 Swup transition complete, re-rendering mermaid...");
        
        setTimeout(() => renderMermaidWithRetry(3, 50), 50);
      });
      console.log("✅ Mermaid-Swup integration ready");
    } else {
      
      setTimeout(setupSwupIntegration, 100);
    }
  }

  
  document.addEventListener("DOMContentLoaded", function () {
    console.log("🚀 Initializing KaTeX...");

    
    renderMermaidWithRetry();

    
    setupSwupIntegration();
  });



</script>

  <script>
    (function () {
      const btn = document.getElementById('nav-toggle');
      const menu = document.getElementById('mobile-menu');
      if (btn && menu) {
        btn.addEventListener('click', () => {
          const open = menu.classList.toggle('hidden') === false;
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      }

      const themeToggleBtn = document.getElementById('theme-toggle');
      const darkIcon = document.getElementById('theme-toggle-dark-icon');
      const lightIcon = document.getElementById('theme-toggle-light-icon');

      if (themeToggleBtn) {
        if (document.documentElement.classList.contains('dark')) {
            lightIcon.classList.remove('hidden');
        } else {
            darkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');

            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });
      }
    })();
  </script>
